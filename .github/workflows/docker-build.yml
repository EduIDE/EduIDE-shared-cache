# Builds the cache server image for every PR and every push to main.
#
# This workflow never publishes a chart-version tag. The chart pins the image
# tag to its own version (image.tag defaults to Chart.Version), so a push here
# that wrote X.Y.Z would silently swap the image under an already published
# chart. Only release.yml publishes X.Y.Z, once, together with the chart.
#
#   push to main  ->  latest, latest-<sha>
#   pull request  ->  pr-<N>, pr-<N>-<sha>  (the PR preview chart pins pr-<N>)

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'chart/**'
      - '.github/workflows/docker-build.yml'
  # Every PR that can get a preview chart needs its pr-<N> image, whatever its base branch.
  pull_request:
    paths:
      - 'src/**'
      - 'chart/**'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/chart-preview.yml'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      image-name: eduide/eduide-shared-cache/gradle-cache
      docker-context: ./src
      docker-file: ./src/Dockerfile
      free-disk-space: false
    secrets: inherit
