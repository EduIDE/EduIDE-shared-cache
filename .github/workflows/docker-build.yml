# Builds the cache server image for every PR and every push to main.
#
# Never publishes a chart-version tag on its own: the chart pins the image tag
# to its own version (image.tag defaults to Chart.Version), so a push here that
# wrote X.Y.Z would swap the image under an already published chart. Only
# release.yml publishes X.Y.Z, once, together with the chart.
#
#   push to main  ->  latest, latest-<sha>
#   pull request  ->  pr-<N>, pr-<N>-<sha>  (the PR preview chart pins pr-<N>)
#   release.yml   ->  X.Y.Z, X.Y.Z-<sha>

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/docker-build.yml'
  # Every PR that can get a preview chart needs its pr-<N> image.
  pull_request:
    paths:
      - 'src/**'
      - 'chart/**'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/chart-preview.yml'
  # Called by release.yml, which passes the release version as image_tag.
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag, e.g. 0.6.0"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      image-name: eduide/eduide-shared-cache/gradle-cache
      docker-context: ./src
      docker-file: ./src/Dockerfile
      # Empty on push and pull request, where the shared workflow derives the
      # tag. From release.yml the event is workflow_dispatch on main, which
      # would derive "latest", so the release passes the version explicitly.
      image-tag: ${{ inputs.image_tag }}
      free-disk-space: false
    secrets: inherit
