# Publishes chart X.Y.Z and the image tag X.Y.Z it pins, once per version.
#
# A published version is immutable: if chart X.Y.Z already exists, this
# workflow fails instead of overwriting it. Bump `version` in chart/Chart.yaml
# to release. Only this workflow writes the X.Y.Z image tag, and only after the
# check passed, so an image a published chart points at never changes.

name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read

# Two runs for the same version could both pass the check before either
# publishes. Queue them, so the second one sees the first one's chart.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.chart.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Extract chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fail if the version is already published
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          CHART="oci://ghcr.io/${OWNER}/charts/eduide-shared-cache"
          if OUT=$(helm show chart "${CHART}" --version "${VERSION}" 2>&1); then
            echo "::error::${CHART}:${VERSION} is already published. Bump version in chart/Chart.yaml."
            exit 1
          fi
          # Anything other than "not found" (registry down, auth) must not be
          # mistaken for a free version.
          if ! grep -q 'not found' <<< "${OUT}"; then
            echo "${OUT}"
            echo "::error::Could not check whether ${CHART}:${VERSION} exists."
            exit 1
          fi

  image:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      image-name: eduide/eduide-shared-cache/gradle-cache
      docker-context: ./src
      docker-file: ./src/Dockerfile
      image-tag: ${{ needs.check.outputs.version }}
      free-disk-space: false
    secrets: inherit

  release:
    needs: [check, image]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update chart dependencies
        run: helm dependency update ./chart

      - name: Set registry owner
        run: echo "REGISTRY_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push to OCI
        run: |
          helm package ./chart
          helm push eduide-shared-cache-${{ needs.check.outputs.version }}.tgz oci://ghcr.io/${{ env.REGISTRY_OWNER }}/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eduide-shared-cache-${{ needs.check.outputs.version }}
          name: eduide-shared-cache ${{ needs.check.outputs.version }}
          generate_release_notes: true
