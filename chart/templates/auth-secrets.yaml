{{- if and .Values.enabled .Values.auth.enabled }}
# Read-only cache credentials (for EduIDE / students).
# Only needed when auth is enabled; with auth disabled reads are anonymous.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-reader
  labels:
    role: reader
type: kubernetes.io/basic-auth
data:
  username: {{ required "auth.reader.username is required when auth.enabled=true" .Values.auth.reader.username | b64enc | quote }}
  password: {{ required "auth.reader.password is required when auth.enabled=true (set it, e.g. via a GitHub environment secret)" .Values.auth.reader.password | b64enc | quote }}
---
{{- end }}
{{- if .Values.enabled }}
# Read-write cache credentials (for CI/CD, admin, cache pre-warming).
# Writes always require authentication, even when auth.enabled is false, so the
# writer credentials are always provisioned.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-writer
  labels:
    role: writer
type: kubernetes.io/basic-auth
data:
  username: {{ required "auth.writer.username is required" .Values.auth.writer.username | b64enc | quote }}
  password: {{ required "auth.writer.password is required (set it, e.g. via a GitHub environment secret)" .Values.auth.writer.password | b64enc | quote }}
{{- end }}
